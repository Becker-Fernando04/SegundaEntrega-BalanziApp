<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>BalanziApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Selector de tipo: Gasto o Ingreso -->
  <ion-segment [(ngModel)]="tipoMovimiento" mode="md" class="tipo-segment">
    <ion-segment-button value="gasto">
      <ion-icon name="arrow-down-circle-outline"></ion-icon>
      <ion-label>Gasto</ion-label>
    </ion-segment-button>
    <ion-segment-button value="ingreso">
      <ion-icon name="arrow-up-circle-outline"></ion-icon>
      <ion-label>Ingreso</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- Formulario de registro en tarjeta -->
  <ion-card class="formulario-card">
    <ion-card-content>
      <ion-list lines="inset">

        <!-- Monto -->
        <ion-item>
          <ion-icon name="cash-outline" slot="start" color="medium"></ion-icon>
          <ion-input
            type="number"
            label="Monto"
            labelPlacement="floating"
            placeholder="0.00"
            [(ngModel)]="monto">
          </ion-input>
        </ion-item>

        <!-- Categoría -->
        <ion-item>
          <ion-icon name="pricetag-outline" slot="start" color="medium"></ion-icon>
          <ion-select
            label="Categoría"
            labelPlacement="floating"
            placeholder="Seleccionar categoría"
            [(ngModel)]="categoria">
            <ion-select-option *ngFor="let cat of categoriasDisponibles" [value]="cat">
              {{ cat }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Descripción -->
        <ion-item>
          <ion-icon name="document-text-outline" slot="start" color="medium"></ion-icon>
          <ion-input
            type="text"
            label="Descripción"
            labelPlacement="floating"
            placeholder="Ej: Compra mensual, Sueldo, etc."
            [(ngModel)]="descripcion">
          </ion-input>
        </ion-item>

        <!-- Fecha -->
        <ion-item>
          <ion-icon name="calendar-outline" slot="start" color="medium"></ion-icon>
          <ion-input
            type="date"
            label="Fecha"
            labelPlacement="floating"
            [(ngModel)]="fecha">
          </ion-input>
        </ion-item>

        <!-- Método de pago -->
        <ion-item>
          <ion-icon name="card-outline" slot="start" color="medium"></ion-icon>
          <ion-select
            label="Método de pago"
            labelPlacement="floating"
            placeholder="Seleccionar método"
            [(ngModel)]="metodoPago">
            <ion-select-option *ngFor="let metodo of metodosPago" [value]="metodo">
              {{ metodo }}
            </ion-select-option>
          </ion-select>
        </ion-item>

      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- Botón Guardar -->
  <div class="boton-contenedor">
    <ion-button expand="block" shape="round" color="primary" size="large" (click)="guardar()">
      <ion-icon slot="start" name="save-outline"></ion-icon>
      Guardar
    </ion-button>
  </div>

</ion-content>
