<ion-tabs>
  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="inicio">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>{{ t.tabInicio }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="movimientos">
      <ion-icon name="swap-horizontal-outline"></ion-icon>
      <ion-label>{{ t.tabMovimientos }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="registros">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>{{ t.tabRegistros }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="estadistica">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <ion-label>{{ t.tabEstadistica }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="presupuestos">
      <ion-icon name="wallet-outline"></ion-icon>
      <ion-label>{{ t.tabPresupuestos }}</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
